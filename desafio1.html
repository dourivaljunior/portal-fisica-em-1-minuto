<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>
    Desafio 1
  </title>

  <link rel="stylesheet"
        href="style.css">

</head>

<body>

<div class="background"></div>

<header class="main-header">

  <div class="hero-box">

    <h1>
      Desafio 1
    </h1>

  </div>

</header>

<section class="challenge-container">

  <!-- QUESTÃO -->

  <div class="content-box">

    <h3>
      📘 Questão envolvendo o conceito de força (peso, normal e de atrito) e a aplicação da 2a lei de Newton.
    </h3>

    <img
      src="desafio1.jpg"
      class="question-image"
      alt="Questão do desafio">

    <!-- AUDIO -->
    <audio
      controls
      class="audio-player">

      <source
        src="desafio1.mp3"
        type="audio/mpeg">

    </audio>

  </div>

  <!-- VÍDEO – Google Drive embed com tamanho ajustado -->
  <div class="content-box">

    <h2>
      🎥 Resolução
    </h2>

    <!-- Wrapper para manter proporção e tamanho correto -->
    <div class="video-wrapper">

      <iframe
        src="https://drive.google.com/file/d/1qpgwAtJZ-xnKtA5ZDx6Kfqt92hnJtMi6/preview"
        class="video-player"
        allowfullscreen
        allow="autoplay">
      </iframe>

    </div>

  </div>

</section>

<button
class="back-btn"
onclick="goBack()">

⬅ Retornar

</button>

<script src="script.js"></script>

</body>
</html>
